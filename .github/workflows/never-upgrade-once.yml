name: NEVER one-time capture upgrade

on:
  push:
    branches:
      - dev/foundation
    paths:
      - .github/never-upgrade-trigger-v2

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/upgrade_never_capture.py
      - name: Validate
        run: |
          npm ci
          npm test
          npm run lint
          npx tsc --noEmit
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make NEVER scans intelligent and source-first"
          git push origin HEAD:dev/foundation
