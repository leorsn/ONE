name: NEVER Quality

on:
  push:
    branches:
      - main
      - dev/foundation
      - design/never-material-worlds
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned lint tooling
        run: npm install --no-save --package-lock=false --no-audit --no-fund eslint@9.39.5 eslint-config-expo@57.0.2

      - name: Quality gate
        run: npm run quality

      - name: Verify clean checkout
        run: |
          git status --short
          test -z "$(git status --porcelain)"
